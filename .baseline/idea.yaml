idea:
  title: LLMs are bad at keeping obvious secrets
  domain: artificial_intelligence
  hypothesis: 'LLMs are bad at keeping obvious secrets. For instance, when LLMs write

    fiction they foreshadow plot way too much because planning and prose

    generation are entangled: the model can''t help but hint at what it knows is

    coming. The model wants to say what it''s thinking, without being told it

    has to. Is this still true when it can rely on a plan it''s conditioning on

    that sets up the future so it doesn''t have to constantly get ready for

    that future on its own?


    Concretely: when a model writes a story while holding a secret it was told

    not to reveal, does giving it an explicit plan or outline to follow reduce

    how much of the secret leaks into the text? And what is the mechanism of

    the leak: is the secret concept active in the model''s internal state

    throughout generation, and does removing it remove the leakage?

    '
  background:
    description: "What is known. The idea's author has since published the behavioural\
      \ core:\nHoltzman and West, \"Can You Keep a Secret? Involuntary Information\n\
      Leakage in Language Model Writing\" (arXiv 2605.10794, May 2026). A writer\n\
      model gets a secret word plus an instruction not to mention or hint at\nit,\
      \ and writes a story of about 450 words; a guesser model then picks\nwhich of\
      \ two texts was written with the secret (two-alternative forced\nchoice). They\
      \ report 70-79% discrimination for several frontier models\n(two were below\
      \ chance), that an \"actively hide\" instruction pushes\nleakage below chance,\
      \ that short jokes do not leak, and that a decoy word\nredirects the leakage.\
      \ That work is behavioural and API-based, and the\npaper itself says a more\
      \ mechanistic study is needed. It used 15 secret\nwords: umbrella, lighthouse,\
      \ violin, cactus, telescope, justice,\npatience, entropy, nostalgia, freedom,\
      \ bracket, Tuesday, copper, margin,\ninvoice. Related lines: semantic leakage\
      \ (Gonen et al. 2025); Taboo\nmodel organisms where a secret word is fine-tuned\
      \ in and recovered with\nlogit lens and SAEs (Cywinski et al.), which does not\
      \ address\ninvoluntary leakage into unrelated text; secrecy without private\
      \ state\n(Baldelli et al.); ironic negation (Mann et al.); and evidence that\n\
      models plan future tokens in hidden states (2502.06258, 2404.00859, and\nAnthropic's\
      \ planning-in-poems result).\n\nGap. Two things appear untouched. (1) The idea's\
      \ actual question: does\nconditioning on an explicit plan or outline reduce\
      \ leakage, and does it\nhold for plot-level secrets (a twist the model knows\
      \ is coming) rather\nthan only single words? (2) Mechanism: is the secret represented\
      \ in the\nresidual stream throughout story generation, does its strength predict\n\
      leakage, and does ablating it remove leakage? A run that only replicates\nthe\
      \ published secret-word effect adds little.\n\nScope and pitfalls.\n- Model-size\
      \ threshold (the main risk). The prior paper reports NO\n  leakage for Llama\
      \ 3.2-3B and Llama 3.1-8B, marginal leakage for Gemma 3\n  4B (59%), and strong\
      \ leakage (83-84%) for Gemma 3 12B/27B and Llama 3.3\n  70B. A writer model\
      \ of about 8-9B or smaller is therefore expected to\n  show a floor effect with\
      \ nothing to explain. Gemma 3 12B is the\n  smallest model reported to leak\
      \ strongly.\n- Models: gated repos (google/gemma-*, meta-llama/*) need the HF_TOKEN\n\
      \  environment variable to have been granted access; if a download is\n  refused,\
      \ unsloth/gemma-3-12b-it works without it. SAEs for this model\n  are in google/gemma-scope-2-12b-it\
      \ (ungated; newer and less supported\n  tooling). An OpenRouter API key is available\
      \ as OPENROUTER_KEY (for\n  example for the guesser model).\n- Confound in any\
      \ plan condition: an outline both adds context (which\n  may just dilute the\
      \ secret's salience) and fixes content decisions. A\n  comparison is only informative\
      \ if it can tell these apart, for example\n  against length-matched irrelevant\
      \ context.\n- The known effects give yardsticks: the plain \"secret plus do\
      \ not\n  reveal\" condition is a positive anchor, and the decoy word is a known\n\
      \  mitigation to compare effect sizes against.\n- Measurement: guesser judgments\
      \ are noisy and position-biased, so both\n  presentation orders and enough trials\
      \ are needed to separate, say, 80%\n  from 65%. For plot-level secrets, candidate\
      \ twists may be guessable\n  from the premise alone, so a no-secret control\
      \ is needed. For\n  ablations, compare against random and other-concept directions\
      \ and\n  check that story quality is not simply degraded.\n"
    papers:
    - url: https://arxiv.org/abs/2605.10794
      description: Holtzman and West, Can You Keep a Secret? Involuntary Information
        Leakage in Language Model Writing (May 2026). The behavioural core of this
        idea, by its author; does not test a plan/outline condition, plot-level secrets,
        or mechanism.
    - url: https://arxiv.org/abs/2505.14352
      description: Cywinski et al., Towards eliciting latent knowledge from LLMs with
        mechanistic interpretability. Taboo model organisms (fine-tuned Gemma-2-9b);
        logit lens and SAEs recover the secret word.
    - url: https://arxiv.org/abs/2510.01070
      description: Eliciting Secret Knowledge from Language Models. Taboo-style secret
        elicitation; the secret is fine-tuned in and the model is meant to hint.
    - url: https://arxiv.org/abs/2601.06973
      description: 'Baldelli et al., LLMs Can''t Play Hangman: On the Necessity of
        a Private Working Memory for Language Agents. Impossibility result on secrecy
        plus consistency without private state.'
    - url: https://arxiv.org/abs/2603.25187
      description: Probing the Lack of Stable Internal Beliefs in LLMs (20-questions
        implicit consistency).
    - url: https://arxiv.org/abs/2511.12381
      description: 'Mann et al., Don''t think of the white bear: ironic negation in
        transformer models.'
    - url: https://arxiv.org/abs/2310.17884
      description: Mireshghallah et al., Can LLMs Keep a Secret? Contextual-integrity
        view of secret keeping.
    - url: https://arxiv.org/abs/2502.06258
      description: Emergent Response Planning in LLMs. Planning information in hidden
        states.
    - url: https://arxiv.org/abs/2404.00859
      description: Do Language Models Plan Ahead for Future Tokens?
    - url: https://arxiv.org/abs/2402.17119
      description: Suspense generation with outlines; evaluates suspense, not leakage.
  metadata:
    author: Ari Holtzman
